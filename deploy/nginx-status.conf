# Public files only, copied from public/status into a dedicated web directory.
# Keep these locations before the existing /agenda/ proxy location.
location = /agenda/status {
    return 308 /agenda/status/;
}
# Only the sanitized public history is exposed from the monitor's state directory.
location = /agenda/status/history.json {
    alias /var/lib/passerelle-status/history.json;
    limit_except GET { deny all; }
    default_type application/json;
    gzip on;
    gzip_types application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
location ^~ /agenda/status/ {
    alias /var/www/passerelle-status/;
    index index.html;
    autoindex off;
    limit_except GET { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
}
